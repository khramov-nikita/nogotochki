services:
  nogotochki:
    build: .
    # Внутренний порт для Coolify-прокси; без host bind 3000:3000 (конфликт при редеплое).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/nogotochki.sqlite
      TRUST_PROXY: "1"
    volumes:
      - nogotochki_data:/data
    restart: unless-stopped

volumes:
  nogotochki_data:
